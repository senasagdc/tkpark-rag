# Yerel geliştirme ortamı. Şimdilik yalnızca vektör veritabanı; backend ve frontend sonra eklenecek.
#   Aç:      docker compose up -d
#   Durum:   docker compose ps
#   Loglar:  docker compose logs db
#   Kapat:   docker compose down       (veriler volume'de kalır; "down -v" volume'ü de SİLER)
# Ayarlar (kullanıcı, şifre, veritabanı) docker/db.env'de; örneği docker/db.env.example.

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18     # PostgreSQL 18 + pgvector 0.8.7
    container_name: tkpark-db
    env_file: docker/db.env                 # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    ports:
      - "127.0.0.1:5432:5432"               # yalnızca bu bilgisayardan erişilir (DBeaver, Python)
    volumes:
      - pgdata:/var/lib/postgresql          # PG 18: veri klasörü /var/lib/postgresql/18/docker
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro   # yalnızca volume boşken (ilk kurulumda) çalışır
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
    name: tkpark-pg-data
